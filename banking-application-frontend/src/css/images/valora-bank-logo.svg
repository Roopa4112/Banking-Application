<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Valora Bank logo">
  <!-- Background is transparent so you can place the logo on any background -->
  <!-- Color variables: main = deep blue, accent = white -->
  <defs>
    <style>
      .vb-main { fill: #0B3D91; } /* deep blue */
      .vb-text { fill: #0B3D91; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .vb-subtext { fill: #0B3D91; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Shield icon -->
  <g id="shield" transform="translate(40,20)">
    <!-- outer shield shape -->
    <path class="vb-main" d="M60 0
                             C96 0 120 16 120 48
                             C120 96 90 140 60 156
                             C30 140 0 96 0 48
                             C0 16 24 0 60 0 Z"/>
    <!-- inner white V (cutout) -->
    <path d="M33 38 L45 38 L60 74 L75 38 L87 38 L60 110 Z" fill="#ffffff"/>
  </g>

  <!-- Text: Valora (large) -->
  <text x="170" y="80" font-size="48" class="vb-text">Valora</text>

  <!-- Text: Bank (smaller, aligned under Valora) -->
  <text x="170" y="120" font-size="30" class="vb-subtext">Bank</text>
</svg>
