<!-- ✅ Transfer Form -->
<oj-bind-if test="[[!transferSuccess()]]">
  <div id="transfer-container" class="oj-flex oj-sm-justify-content-center oj-sm-align-items-center" style="min-height:100vh; padding:30px;">
    <div class="oj-panel custom-panel">
      <h2 class="oj-typography-heading-sm oj-text-center">Transfer Funds</h2>
      <oj-form-layout max-columns="1" class="oj-sm-width-full">

        <!-- From Account -->
        <oj-select-single
            id="fromAccount"
            data="[[userAccountsDP]]"
            value="{{fromAccount}}"
            value-attribute="value"
            label-hint="From Account"
            required
            class="oj-form-control-full-width"
            placeholder="Select your account">
            <template slot="itemTemplate" data-oj-as="item">
                <span><oj-bind-text value="[[item.data.label]]"></oj-bind-text></span>
            </template>
        </oj-select-single>

        <!-- To Account -->
        <oj-select-single
            id="toAccount"
            data="[[allAccountsDP]]"
            value="{{toAccount}}"
            value-attribute="value"
            label-hint="To Account"
            required
            class="oj-form-control-full-width"
            placeholder="Select destination account">
            <template slot="itemTemplate" data-oj-as="item">
                <span><oj-bind-text value="[[item.data.label]]"></oj-bind-text></span>
            </template>
        </oj-select-single>

        <!-- Amount -->
        <oj-input-number
          id="amount"
          label-hint="Amount"
          value="{{amount}}"
          min="1000"
          step="100"
          required
          class="oj-form-control-full-width">
        </oj-input-number>

        <!-- Transfer Button -->
        <div class="oj-text-center oj-sm-margin-top-4x">
          <oj-button id="transferBtn" on-oj-action="[[transferAmount]]" class="oj-button-primary oj-button-fullwidth">
            Transfer
          </oj-button>
        </div>

        <p class="oj-sm-margin-top-2x oj-text-danger">
          <oj-bind-text value="[[transferMessage]]"></oj-bind-text>
        </p>
      </oj-form-layout>
    </div>
  </div>
</oj-bind-if>

<!-- ✅ Transfer Success Panel -->
<oj-bind-if test="[[transferSuccess()]]">
  <div class="oj-flex oj-sm-justify-content-center oj-sm-align-items-center" style="min-height:100vh; padding:30px;">
    <div class="oj-panel custom-panel">

      <h2 class="oj-typography-heading-sm oj-text-color-success oj-text-center">✅ Transfer Successful</h2>

<p>Transaction ID:
  <strong><oj-bind-text value="[[transferResponse().id]]"></oj-bind-text></strong>
</p>
<p>From Account:
  <oj-bind-text value="[[transferResponse().accountId]]"></oj-bind-text>
</p>
<p>To Account:
  <oj-bind-text value="[[transferResponse().counterpartyAccountId]]"></oj-bind-text>
</p>
<p>Amount: ₹<oj-bind-text value="[[transferResponse().amount]]"></oj-bind-text></p>
<p>Status:
  <span class="oj-text-color-success">
    <oj-bind-text value="[[transferResponse().status]]"></oj-bind-text>
  </span>
</p>
<p>Date:
  <oj-bind-text value="[[transferResponse().date]]"></oj-bind-text>
</p>


      <!-- Actions -->
      <div class="oj-sm-margin-4x-top oj-flex oj-flex-wrap oj-flex-gap-2x">
        <oj-button on-oj-action="[[makeAnotherTransfer]]" class="oj-button-fullwidth">Make Another Transfer</oj-button>
        <!-- <oj-button on-oj-action="[[goToAccounts]]" chroming="outlined" class="oj-button-fullwidth">Back to Accounts</oj-button> -->
      </div>

    </div>
  </div>
</oj-bind-if>

<style>
  .custom-panel {
    max-width: 400px;
    width: 100%;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    background-color: #ffffff;
  }
</style>
