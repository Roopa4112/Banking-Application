<div class="oj-flex oj-sm-justify-content-center oj-sm-align-items-center" style="min-height:100vh; padding:30px;">
  <div class="oj-panel custom-panel">
    <h2 class="oj-typography-heading-sm oj-text-center">Login</h2>

    <!-- Show logout if already logged in -->
    <oj-bind-if test="[[isLoggedIn()]]">
      <div class="oj-text-center oj-margin-top-4x">
        <span>Welcome! You are already logged in.</span>
        <oj-button class="oj-button-secondary oj-sm-margin-start-2x"
                   on-oj-action="[[logout]]">
          Logout
        </oj-button>
      </div>
    </oj-bind-if>

    <!-- Login Form -->
    <oj-validation-group id="loginForm" data-bind="submit: submit">
      <oj-form-layout max-columns="1" direction="column" label-edge="top">

        <!-- Email -->
        <oj-input-text id="email"
                       value="{{email}}"
                       label-hint="Email ID"
                       required
                       data-bind="enable: !isLoggedIn()"
                       class="oj-form-control-full-width">
        </oj-input-text>

        <!-- Password -->
        <oj-input-password id="password"
                           value="{{password}}"
                           label-hint="Password"
                           required
                           data-bind="enable: !isLoggedIn()"
                           class="oj-form-control-full-width">
        </oj-input-password>

        <!-- Role Selection -->
        <oj-radioset id="role"
                     value="{{userType}}"
                     aria-label="Login as"
                     data-bind="enable: !isLoggedIn()"
                     class="oj-form-control-full-width">
          <oj-option value="customer">Customer</oj-option>
          <oj-option value="employee">Employee</oj-option>
        </oj-radioset>

        <!-- Submit (Login) Button -->
        <oj-button id="loginBtn" 
                   on-oj-action="[[login]]" 
                   class="oj-button-primary oj-sm-margin-top-4 oj-button-fullwidth"
                   data-bind="visible: !isLoggedIn()">
          Submit
        </oj-button>

        <!-- Signup link -->
        <div class="oj-text-center oj-margin-top-2x">
          <a href="?ojr=signup">Don't have an account? Register here</a>
        </div>

        <!-- Error Messages -->
        <oj-bind-if test="[[loginError()]]">
          <div class="oj-message-error oj-sm-margin-2x-top oj-text-center"
               style="color:red; font-size:14px;">
            <oj-bind-text value="[[loginError]]"></oj-bind-text>
          </div>
        </oj-bind-if>

      </oj-form-layout>
    </oj-validation-group>
  </div>
</div>

<style>
  .custom-panel {
    max-width: 400px;
    width: 100%;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    background-color: #ffffff;
  }
</style>
